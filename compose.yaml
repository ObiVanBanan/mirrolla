services:
  api:
    build: .
    container_name: mirrolla-api
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports/output:/app/reports/output
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ui:
    image: nginx:alpine
    container_name: mirrolla-ui
    ports:
      - "8080:80"
    volumes:
      - ./ui/mirrolla_assistant.html:/usr/share/nginx/html/index.html:ro
      - ./ui/mirrolla.css:/usr/share/nginx/html/mirrolla.css:ro
      - ./ui/app.js:/usr/share/nginx/html/app.js:ro
      - ./ui/dataset_workspace.js:/usr/share/nginx/html/dataset_workspace.js:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
